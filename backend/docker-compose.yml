version: '3.8'

services:
  # ─── 1. Public Nginx Reverse Proxy (Front-facing) ───
  nginx:
    image: nginx:alpine
    container_name: zanko_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - zanko_network

  # ─── 2. Internal Node.js API (Not directly exposed to internet) ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zanko_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zanko_secure_redis_2026}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-google}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-30000}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
    depends_on:
      - redis
    networks:
      - zanko_network

  # ─── 3. Background BullMQ Queue Worker ───
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zanko_worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zanko_secure_redis_2026}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      - redis
    networks:
      - zanko_network

  # ─── 4. Redis Cache & Queue Storage (Private, Authenticated, Persistent) ───
  redis:
    image: redis:7-alpine
    container_name: zanko_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-zanko_secure_redis_2026}
    volumes:
      - redis_data:/data
    networks:
      - zanko_network

volumes:
  redis_data:
    driver: local

networks:
  zanko_network:
    driver: bridge
