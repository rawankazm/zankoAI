# ==============================================================================
# ZankoAI Production Multi-Container Orchestration Manifest
# Self-Hosted PostgreSQL 16, Redis 7, Express 4 REST API, & BullMQ Queue Worker
# ==============================================================================

version: '3.8'

services:
  # ─── 1. Public Nginx Reverse Proxy (Front-Facing, SSL/TLS Termination) ───
  nginx:
    image: nginx:alpine
    container_name: zanko_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - zanko_network

  # ─── 2. Self-Hosted PostgreSQL 16 Database (Private, Auto-Migrations) ─────
  postgres:
    image: postgres:16-alpine
    container_name: zanko_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zanko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_zanko_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zanko_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    networks:
      - zanko_network

  # ─── 3. Redis In-Memory Cache & BullMQ Queue Storage (Private, 128MB LRU) ─
  redis:
    image: redis:7-alpine
    container_name: zanko_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-zanko_production_vault_redis_password_2026}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zanko_production_vault_redis_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - zanko_network

  # ─── 4. Internal Node.js Express 4 API Service (Private, 400MB RAM) ───────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zanko_api
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_zanko_2026}@postgres:5432/zanko_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=zanko_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_zanko_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zanko_production_vault_redis_password_2026}
      - STORAGE_PATH=/app/uploads
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
    volumes:
      - storage_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 400m
    deploy:
      resources:
        limits:
          memory: 400M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - zanko_network

  # ─── 5. Dedicated BullMQ Queue Worker Container (Private, 450MB RAM) ─────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zanko_worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_zanko_2026}@postgres:5432/zanko_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=zanko_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_zanko_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-zanko_production_vault_redis_password_2026}
      - STORAGE_PATH=/app/uploads
      - WORKER_CONCURRENCY=1
    volumes:
      - storage_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 450m
    deploy:
      resources:
        limits:
          memory: 450M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - zanko_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  zanko_network:
    driver: bridge
