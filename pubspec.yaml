name: zanko_ai
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2002

environment:
  sdk: ^3.10.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.0
  uuid: ^4.4.0
  file_picker: ^8.1.3
  image_picker: ^1.1.2
  flutter_tts: ^4.1.0
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  sqflite: ^2.3.0
  path: ^1.9.0
  device_preview: ^1.3.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  syncfusion_flutter_pdf: ^28.1.33
  syncfusion_flutter_pdfviewer: ^28.1.33
  record: ^5.2.0
  path_provider: ^2.1.4
  archive: ^4.0.0
  speech_to_text: ^7.4.0
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  record_linux: ^1.3.1
  record_web: ^1.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/robot.png
    - assets/images/trophy.png
    - assets/images/student_avatar_3d.png
    - assets/data/krg_zankoline.json
    - assets/fonts/
    - assets/fonts/calibri.ttf
    - assets/fonts/calibrib.ttf
    - assets/fonts/times.ttf
    - assets/fonts/timesbd.ttf
    - assets/fonts/DroidKufi-Regular.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
    - assets/fonts/NotoNaskhArabic-Regular.ttf
    - assets/fonts/NotoNaskhArabic-Bold.ttf
    - assets/fonts/K24KurdishBold-Bold.ttf

  # Custom fonts for Kurdish Sorani and Arabic
  fonts:
    - family: K24KurdishBold
      fonts:
        - asset: assets/fonts/K24KurdishBold-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Calibri
      fonts:
        - asset: assets/fonts/calibri.ttf
        - asset: assets/fonts/calibrib.ttf
          weight: 700
        - asset: assets/fonts/K24KurdishBold-Bold.ttf
          weight: 700
    - family: Times
      fonts:
        - asset: assets/fonts/times.ttf
        - asset: assets/fonts/timesbd.ttf
          weight: 700
    - family: DroidKufi
      fonts:
        - asset: assets/fonts/DroidKufi-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E27"
  adaptive_icon_foreground: "assets/images/app_icon.png"
