# ==============================================================================
# ZankoAI Production Nginx Configuration
# Reverse Proxy, SSL Termination & Edge Rate-Limiting
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging format
    log_format production_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log production_json;
    error_log  /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Client payload size (25MB for academic PDF/notes uploads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Edge Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;

    # Upstream Node.js API Service (Internal Docker Bridge)
    upstream zanko_api {
        server api:4000;
        keepalive 64;
    }

    # Strict CORS Whitelist Map (Zero wildcard production policy)
    map $http_origin $cors_origin {
        default "";
        "https://zanko-admin.vercel.app" "$http_origin";
        "https://zankoai.com" "$http_origin";
        "https://www.zankoai.com" "$http_origin";
    }

    # Include modular domain configurations
    include /etc/nginx/conf.d/*.conf;
}
