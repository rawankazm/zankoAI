# ==============================================================================
# ZankoAI Production Domain Server Block: api.zankoai.com
# SSL/TLS Termination, Strict CORS, Security Headers, and Rate Limiting
# ==============================================================================

# ─── 1. HTTP Server (Port 80): ACME Challenge & HTTPS Redirect ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.zankoai.com;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (HTTP 301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. HTTPS Server (Port 443): Production SSL/TLS Termination ───────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zankoai.com;

    # SSL / TLS Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.zankoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zankoai.com/privkey.pem;

    # Strong SSL Protocol & Cipher Suites (Mozilla Modern Recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ─── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # ─── Strict CORS Configuration (Zero Wildcard) ────────────────────────────
    # Injected dynamically only if origin is explicitly in whitelist
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-Id' always;
    add_header Access-Control-Expose-Headers 'Content-Length,Content-Range,X-Request-Id' always;

    # ─── Liveness Probe (/api/health) ──────────────────────────────────────────
    # Unthrottled passthrough for cloud uptime monitors & orchestrators
    location = /api/health {
        proxy_pass http://zanko_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Readiness Probe (/api/ready) ─────────────────────────────────────────
    # Unthrottled passthrough for dependency checks
    location = /api/ready {
        proxy_pass http://zanko_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Auth Routes (Stricter Rate Limiting) ──────────────────────────────────
    location /api/auth/ {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-Id' always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        limit_req zone=api_auth burst=15 nodelay;

        proxy_pass http://zanko_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── General API Endpoints ─────────────────────────────────────────────────
    location /api/ {
        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-Id' always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://zanko_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy AI generation or OCR
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── Default 404 Fallback for Non-API Paths ────────────────────────────────
    location / {
        default_type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"ZankoAI Production Gateway: Use /api endpoints"}}';
    }
}
